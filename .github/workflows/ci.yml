name: app-ci

on:
  pull_request:
    paths: ["app/**", ".github/workflows/ci.yml"]
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/ci.yml"]

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: demo-app

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: flake8 --max-line-length 100 .
      - name: Unit tests
        run: pytest -q

  build-scan-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to commit the image tag bump
      id-token: write   # to request the OIDC token for AWS
    env:
      # Deploy steps run only once AWS is provisioned and the AWS_ROLE_ARN secret is set,
      # so the pipeline stays green (build + scan) before then
      DEPLOY_ENABLED: ${{ github.event_name == 'push' && secrets.AWS_ROLE_ARN != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build -t demo-app:${{ steps.meta.outputs.tag }} app

      - name: Scan image (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: demo-app:${{ steps.meta.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Everything below runs only on main with AWS configured: PRs stop after build + scan
      - name: Configure AWS credentials (OIDC, no static keys)
        if: env.DEPLOY_ENABLED == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        if: env.DEPLOY_ENABLED == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image
        if: env.DEPLOY_ENABLED == 'true'
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}
        run: |
          docker tag demo-app:${{ steps.meta.outputs.tag }} "$IMAGE"
          docker push "$IMAGE"

      - name: Bump image in Helm values (GitOps hand-off to Argo CD)
        if: env.DEPLOY_ENABLED == 'true'
        env:
          REPO: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          sed -i "s|^  repository: .*|  repository: ${REPO}|" helm/demo-app/values.yaml
          sed -i "s|^  tag: .*|  tag: \"${TAG}\"|" helm/demo-app/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/demo-app/values.yaml
          git commit -m "deploy: demo-app ${TAG}"
          git push
