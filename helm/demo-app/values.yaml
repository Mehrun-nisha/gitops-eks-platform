replicaCount: 2

# CI rewrites `repository` and `tag` on every merge to main (see .github/workflows/ci.yml).
# Argo CD notices the commit and syncs the cluster to it.
image:
  repository: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/demo-app
  tag: "latest"
  pullPolicy: IfNotPresent

environment: dev

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
